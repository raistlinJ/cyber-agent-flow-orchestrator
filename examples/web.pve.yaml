# PVE group membership grants the application's orchestrator role.
# Configure the PVE hostname to match its certificate; use no users_file here.
version: 1
listen: 127.0.0.1
port: 8443
public_url: https://localhost:8443
# Created on first Proxmox installer run; preserved on reinstall.
# Replace these files with your signed certificate chain and matching private key.
certificate: /certs/cert.pem
private_key: /certs/key.pem
session_idle_seconds: 1800
session_max_seconds: 7200
# Keep either ID, or use [] to hide and disable all bundled sample launches.
samples: [smoke, tools-vs-helper]
# Application maintenance defaults to the caf-maintainers PVE group.
# updates: false  # Disable version/update/rollback controls.
# updates:
#   group: caf-maintainers
#   participant: {url: https://github.com/raistlinJ/cyber-agent-flow.git, ref: main}
#   scenarioforge: {url: https://github.com/raistlinJ/scenarioforge.git, ref: main}

auth:
  provider: pve
  url: https://pve.lab:8006
  ca_file: /etc/pve/pve-root-ca.pem
  required_group: caf-orchestration
  realms: [pve, pam]
