# Paths are relative to THIS web settings YAML, separate from experiment identity.
version: 1
listen: 127.0.0.1
port: 8443
public_url: https://localhost:8443
certificate: ../.local/tls/cert.pem
private_key: ../.local/tls/key.pem
users_file: ../.local/users.json
session_idle_seconds: 1800
session_max_seconds: 28800
