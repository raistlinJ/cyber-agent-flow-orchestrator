# Replace the hostname with the DNS name of your Proxmox host.
# Use a certificate whose SAN matches this hostname, ideally issued by your lab CA.
version: 1
listen: 0.0.0.0
port: 8443
public_url: https://orchestrator.lab:8443
certificate: /certs/cert.pem
private_key: /certs/key.pem
users_file: ../.local/users.json
session_idle_seconds: 1800
session_max_seconds: 28800
