<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in • CAF Orchestrator</title><link rel="stylesheet" href="/style.css"><script src="/http.js" defer></script><script src="/loading.js" defer></script><script src="/login.js" defer></script></head>
<body class="login-page"><header><a class="brand" href="/login"><span class="brand-mark">C</span>CYBER AGENT FLOW<span class="brand-divider">/</span><span class="brand-sub">Orchestrator</span></a><span class="readonly">SECURE ACCESS</span></header>
<main class="login-main"><section class="login-card" aria-labelledby="sign-in-title"><p class="eyebrow">LAB OPERATIONS</p><h1 id="sign-in-title">Welcome back.</h1><p class="intro" id="login-intro">Sign in to your lab workspace.</p><div id="login-status" class="loading-status" role="status" aria-live="polite" hidden><span id="login-status-label"></span><progress aria-label="Sign-in progress"></progress></div><form id="login-form"><fieldset id="login-controls" class="workspace-controls"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="64" required autofocus><label for="password" id="password-label">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required><div id="otp-section" hidden><label for="otp" id="otp-label">One-time code (if required by your realm)</label><input id="otp" name="otp" type="text" autocomplete="one-time-code" maxlength="128"></div><div id="login-error" class="notice" role="alert" hidden></div><button type="submit" id="sign-in">Sign in</button><button type="button" id="restart-login" hidden>Start over</button></fieldset></form><p class="login-note" id="login-note">Accounts are managed by your lab administrator.</p></section></main></body></html>
