[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-agent-flow-orchestrator"
version = "0.1.0"
readme = "README.md"
description = "Host workflows for ScenarioForge and cyber-agent-flow-eval"
requires-python = ">=3.10"
dependencies = ["cyber-agent-flow-eval>=0.2.0", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cyber-agent-flow-orchestrator = "cyber_agent_flow_orchestrator.__main__:main"

[tool.setuptools.packages.find]
include = ["cyber_agent_flow_orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
